<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <meta name="description" content="Remake de Knightmare II: The Maze of Galious con el arte de Hollow Knight.">
    <meta name="theme-color" content="#06070b">
    <link rel="icon" type="image/png" href="TemplateData/icono.png">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #06070b; }
      #juego { position: fixed; inset: 0; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #000; outline: none; }
      #portada {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(rgba(6,7,11,.55), rgba(6,7,11,.85)), url("TemplateData/fondo.jpg") center / cover no-repeat;
        transition: opacity .8s ease; z-index: 2; cursor: default; user-select: none;
        font-family: Georgia, "Times New Roman", serif; color: #e9e4d8; letter-spacing: .08em;
      }
      #portada.oculta { opacity: 0; pointer-events: none; }
      #logo { width: min(62vw, 720px); filter: drop-shadow(0 0 24px rgba(160,190,255,.35)); }
      #barra { margin-top: 5vh; width: min(42vw, 420px); height: 2px; background: rgba(233,228,216,.15); position: relative; }
      #barra > div { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #e9e4d8; box-shadow: 0 0 10px rgba(200,220,255,.8); transition: width .25s; }
      #texto { margin-top: 2.2vh; font-size: clamp(13px, 1.4vw, 18px); opacity: .75; min-height: 1.5em; }
      #portada.lista #texto { opacity: 1; animation: late 1.8s ease-in-out infinite; cursor: pointer; }
      #portada.lista #barra { visibility: hidden; }
      @keyframes late { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="juego"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="portada">
      <img id="logo" src="TemplateData/logo.png" alt="Galious: The Hollow Kingdom">
      <div id="barra"><div></div></div>
      <div id="texto">Cargando…</div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      // A pantalla completa en la ventana; al terminar de cargar, una tecla o un clic pone el navegador a pantalla completa
      // (los navegadores solo lo dejan tras una acción del jugador) y quita la portada. La partida se guarda en el navegador.
      var canvas = document.querySelector("#unity-canvas");
      var portada = document.querySelector("#portada");
      var barra = document.querySelector("#barra > div");
      var texto = document.querySelector("#texto");
      function entrar() {
        if (!portada.classList.contains("lista")) return;
        var raiz = document.documentElement;
        var pedir = raiz.requestFullscreen || raiz.webkitRequestFullscreen;
        if (pedir) { try { var p = pedir.call(raiz); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        portada.classList.add("oculta");
        canvas.focus();
        window.removeEventListener("keydown", entrar);
        portada.removeEventListener("click", entrar);
      }
      createUnityInstance(canvas, {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        autoSyncPersistentDataPath: true,
        showBanner: function () {},
      }, function (progreso) {
        barra.style.width = Math.round(progreso * 100) + "%";
        texto.textContent = progreso < 0.9 ? "Cargando… " + Math.round(progreso * 100) + " %" : "Preparando el reino…";
      }).then(function () {
        portada.classList.add("lista");
        texto.textContent = "Pulsa una tecla o haz clic para entrar";
        window.addEventListener("keydown", entrar);
        portada.addEventListener("click", entrar);
      }).catch(function (mensaje) {
        texto.textContent = "No se pudo cargar: " + mensaje;
      });
    </script>
  </body>
</html>
