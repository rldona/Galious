# Publica la wiki de cómo se hizo (la carpeta wiki/, web estática) en GitHub Pages cuando cambia en main.
# En un repo privado, GitHub Pages necesita GitHub Pro (o Team/Enterprise), y la web es pública para quien tenga el
# enlace. Hay que activarlo una vez: Settings → Pages → Source: GitHub Actions.
name: Wiki

on:
  push:
    branches: [main]
    paths: ['wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: wiki
      - id: deployment
        uses: actions/deploy-pages@v5
