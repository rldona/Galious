# Pruebas EditMode (las 190 y pico de Assets/Tests/EditMode) en cada push y pull request, con GameCI.
# Secretos (Settings → Secrets and variables → Actions): UNITY_LICENSE (el contenido de Unity_lic.ulf), UNITY_EMAIL y
# UNITY_PASSWORD.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: Pruebas EditMode
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Caché de Library
        uses: actions/cache@v6
        with:
          path: unity/MazeOfKnight/Library
          key: library-tests-${{ hashFiles('unity/MazeOfKnight/Packages/packages-lock.json', 'unity/MazeOfKnight/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: library-tests-

      - name: Pruebas
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/MazeOfKnight
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Resultados de las pruebas

      - name: Resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-pruebas
          path: artifacts
          retention-days: 7
